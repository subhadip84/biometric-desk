<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Lookup - Adamas University</title>
<style>
  :root{
    --color-bg:#F5F6F9; --color-surface:#FFFFFF;
    --color-navy:#1B2A4A; --color-navy-deep:#12203A;
    --color-gold:#C9A227;
    --color-success:#1F8A56; --color-success-soft:#E4F3EC;
    --color-pending:#C4432B; --color-pending-soft:#FBEAE6;
    --color-border:#E1E5EC; --color-text:#1D2430; --color-text-muted:#657085;
    --font-display:'Lora', Georgia, serif; --font-body:'Inter', -apple-system, sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 15% 15%, rgba(201,162,39,.16), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(201,162,39,.10), transparent 45%),
      linear-gradient(160deg, var(--color-navy-deep) 0%, var(--color-navy) 55%, #223a63 100%);
    padding:24px; font-family:var(--font-body); color:var(--color-text);
  }
  .card{
    background:#fff; width:100%; max-width:360px; border-radius:20px;
    padding:28px 26px; box-shadow:0 30px 80px rgba(0,0,0,.35); text-align:center;
  }
  .logo{ width:52px; height:52px; object-fit:contain; margin:0 auto 10px; display:block; }
  .org{ font-size:10.5px; color:var(--color-text-muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:18px; }
  .spinner{ width:28px; height:28px; border:3px solid var(--color-border); border-top-color:var(--color-gold); border-radius:50%; margin:20px auto; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .name{ font-family:var(--font-display); font-size:19px; font-weight:700; color:var(--color-navy-deep); margin-bottom:4px; }
  .idline{ font-family:var(--font-mono); font-size:12px; color:var(--color-text-muted); margin-bottom:18px; }
  .status-badge{
    display:inline-flex; align-items:center; gap:8px; padding:10px 20px; border-radius:24px;
    font-size:14px; font-weight:700;
  }
  .status-badge.done{ background:var(--color-success-soft); color:var(--color-success); }
  .status-badge.pending{ background:var(--color-pending-soft); color:var(--color-pending); }
  .context{ font-size:12px; color:var(--color-text-muted); margin-top:14px; }
  .error{ font-size:13px; color:var(--color-pending); line-height:1.6; }
  .footer{ font-size:10.5px; color:var(--color-text-muted); margin-top:22px; }
</style>
</head>

const API_BASE_URL = 'https://biometric-backend-ijiv.onrender.com';

function runScript(fnName, ...args){
  return fetch(API_BASE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fnName, args: args })
  })
    .then(async response => {
      const text = await response.text();
      try{ return JSON.parse(text); }
      catch(parseErr){ throw new Error('The server is still starting up (this can take up to a minute after inactivity) — please try again in a moment.'); }
    })
    .catch(err => { throw new Error(err && err.message ? err.message : 'Network error contacting the backend.'); });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = String(str ?? '');
  return div.innerHTML;
}

async function runLookup(){
  const contentEl = document.getElementById('content');
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');
  const type = urlParams.get('type') === 'hostel' ? 'hostel' : 'main';

  if(!id){
    contentEl.innerHTML = '<div class="error">No identifier provided in this link.</div>';
    return;
  }

  try{
    const fnName = type === 'hostel' ? 'publicLookupHostelStudent' : 'publicLookupStudent';
    const data = await runScript(fnName, id);
    if(!data.ok){
      contentEl.innerHTML = `<div class="error">${escapeHtml(data.error || 'Could not find a matching record.')}</div>`;
      return;
    }
    const isDone = data.status === 'done';
    const contextLabel = type === 'hostel' ? data.hostelName : data.siteCode;
    const idLine = [data.appNo, data.regNo].filter(Boolean).join(' · ');
    contentEl.innerHTML = `
      <div class="name">${escapeHtml(data.name)||'(no name)'}</div>
      <div class="idline">${escapeHtml(idLine)||''}</div>
      <div class="status-badge ${isDone ? 'done' : 'pending'}">${isDone ? '✓ Verified' : '○ Pending'}</div>
      ${contextLabel ? `<div class="context">${escapeHtml(contextLabel)}</div>` : ''}
    `;
  }catch(err){
    contentEl.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
  }
}

runLookup();
</script>
</body>
</html>
