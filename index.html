<style>
  :root{
    --color-bg:#F5F6F9; --color-surface:#FFFFFF;
    --color-navy:#1B2A4A; --color-navy-deep:#12203A; --color-heading:#12203A;
    --color-gold:#C9A227; --color-gold-soft:#F1E4B8;
    --color-success:#1F8A56; --color-success-soft:#E4F3EC;
    --color-pending:#C4432B; --color-pending-soft:#FBEAE6;
    --color-info:#2D6187; --color-info-soft:#E6EEF5;
    --color-border:#E1E5EC; --color-text:#1D2430; --color-text-muted:#657085;
    --font-display:'Lora', Georgia, serif; --font-body:'Inter', -apple-system, sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  html[data-theme="dark"]{
    --color-bg:#0d1117; --color-surface:#161b22;
    --color-navy:#2d4166; --color-navy-deep:#0a1120; --color-heading:#e6edf3;
    --color-gold:#d4af37; --color-gold-soft:#3a3320;
    --color-success:#3fb877; --color-success-soft:#122a1d;
    --color-pending:#e0654a; --color-pending-soft:#2e1712;
    --color-info:#5b9bc9; --color-info-soft:#1a2c38;
    --color-border:#30363d; --color-text:#e6edf3; --color-text-muted:#8b949e;
  }
  html[data-theme="dark"] .verify-card, html[data-theme="dark"] .panel, html[data-theme="dark"] .modal-box{
    background:var(--color-surface);
  }
  body.focus-mode #todayStatsPanel,
  body.focus-mode #prioritySitesPanel,
  body.focus-mode #recentActivityPanel{
    display:none !important;
  }
  @media print{
    header.topbar, .panel, .login-btn, .refresh-btn, .btn, #helpChatToggle, #helpChatPanel,
    #toastContainer, .sortable-th .sort-arrow, .search-hint, .verify-controls{
      display:none !important;
    }
    body{ background:#fff; color:#000; }
    table{ border-collapse:collapse; width:100%; }
    th, td{ border:1px solid #000 !important; padding:6px 8px !important; color:#000 !important; background:#fff !important; }
    .status-pill{ border:1px solid #000; background:#fff !important; color:#000 !important; }
    tr{ border-left:none !important; }
    .print-header{ display:flex !important; }
    body.printing-single-student *{ display:none !important; }
    body.printing-single-student #studentPrintArea{ display:block !important; }
    body.printing-single-student #studentPrintArea *{ display:revert !important; }
  }
  #studentPrintArea{ display:none; }
  .print-header{
    display:none; justify-content:space-between; align-items:flex-end;
    border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:12px; font-size:11px; color:#000;
  }
  .print-header .print-title{ font-family:var(--font-display); font-weight:700; font-size:14px; }
  .print-header .print-meta{ text-align:right; color:#444; }
  *{box-sizing:border-box;}
  body{
    margin:0; color:var(--color-text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; scrollbar-width:thin; scrollbar-color:var(--color-navy) var(--color-bg);
    background:
      radial-gradient(circle at 10% 0%, rgba(201,162,39,.05), transparent 35%),
      radial-gradient(circle at 95% 100%, rgba(201,162,39,.04), transparent 40%),
      var(--color-bg);
    background-attachment:fixed;
  }
